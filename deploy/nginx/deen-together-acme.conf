# The first half of the front-door config: port 80, and nothing else.
#
# It exists because of an ordering problem that can take the OTHER TWO SITES
# on this VPS down.
#
# `deen-together.conf` points `ssl_certificate` at
# `/etc/letsencrypt/live/deen.raselmridha.com/fullchain.pem`, and that
# file does not exist until certbot has issued it. nginx refuses to START with
# an `ssl_certificate` it cannot read — so installing the full file first
# leaves the shared nginx unable to come back up, and hrm., hrmapi. and the
# finance app go with it the next time it restarts.
#
# And certbot cannot issue the certificate until the domain resolves to this
# VPS and its challenge is answered on port 80. Which is what this file is
# for.
#
# The order, then:
#
#   1. install THIS file, `nginx -t`, reload        — nothing is served yet
#   2. point the DNS at the VPS                     — the owner's decision
#   3. certbot certonly --webroot …                 — the certificate exists
#   4. replace this file with `deen-together.conf`, `nginx -t`, reload
#
# Step 4 removes this block, because the full file carries its own port-80
# server for the same name — two blocks with one `server_name` would make
# nginx pick the first and warn about the second.

server {
    listen 80;
    listen [::]:80;
    server_name deen.raselmridha.com;

    # The same webroot the other two sites' certificates are renewed through.
    # It is mounted into the shared nginx container already.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Anything else on this name, until the certificate exists, is honestly a
    # 404 rather than a redirect to an https:// that would not answer.
    location / {
        return 404;
    }
}
