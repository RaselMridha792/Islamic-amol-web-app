# DeenTogether, behind the front door that is already on this VPS.
#
# NOT served by this stack. The machine runs three sites and the finance app's
# nginx holds 80 and 443 for all of them; HRM is already behind it the same
# way. So this file is COPIED to that nginx's conf.d — `/opt/sfm/deploy/nginx/
# conf.d/` — and belongs to this repository, which is where it is edited.
#
# `deploy/HANDOFF.md` assumes a proxy running on the host and points the domain
# at `127.0.0.1:APP_PORT`. That is right for a host-level nginx and wrong here:
# the proxy is a CONTAINER, and `127.0.0.1` inside it is the container itself,
# not the VPS. Every request would 502 and the reason would not be in any log
# worth reading. The app joins the shared `hellonizam-edge` network instead and
# is reached by container name, exactly as `hrm-web-1` is.
#
# ─── two things in here would take the OTHER TWO SITES down ───
#
# 1. `resolver` is inside the server block, not at http level. The HRM config
#    in the same conf.d already declares one there, and nginx refuses to start
#    on a duplicate — which would take hrm., hrmapi. and the finance app with
#    it, for the sake of a site that is not live yet.
#
# 2. Any `limit_req_zone` added later needs a `deen_` name for the same reason:
#    zone names are global to the http block and HRM owns `hrm_*`.
#
# The upstream is named through a VARIABLE on purpose. nginx resolves a
# hostname written literally in `proxy_pass` once, at start-up, and caches it
# for the life of the process — so a container recreated by a rebuild gets a
# new address and nginx goes on talking to the old one until it is restarted.
# Through a variable it resolves per request.

server {
    listen 80;
    listen [::]:80;
    server_name deen-together.hellonizam.com;

    # Certbot's challenge, answered before the certificate exists — and after,
    # because renewal uses the same path. Without it renewal fails silently
    # and the certificate expires one morning.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deen-together.hellonizam.com;

    ssl_certificate     /etc/letsencrypt/live/deen-together.hellonizam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deen-together.hellonizam.com/privkey.pem;

    # Docker's embedded DNS, scoped to this server block. See the note above.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # NOT `X-Frame-Options: DENY`: this is a PWA and the service worker and the
    # install prompt are happier same-origin than framed-out entirely.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Quran audio and images go up and down through here.
    client_max_body_size 25m;

    set $deen_upstream http://deentogether-app-1:3000;

    location / {
        proxy_pass $deen_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app sets a `Secure` session cookie in production and decides
        # from this header. Without it every sign-in appears to work and no
        # cookie is kept.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next's dev-time HMR and any future streaming response.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # The service worker must never be served stale: a cached one keeps an old
    # cache list alive for as long as the browser holds it, and push stops
    # working for people who never hard-reload.
    location = /sw.js {
        proxy_pass $deen_upstream/sw.js;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
